[package]
name = "wordsmith-book"
description = "Wordsmith Book, the desktop app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
wordsmith-book-ui = { workspace = true }
# With the window: the core's start-up opens it (`jcj_shell::desktop`).
jcj-shell = { workspace = true, features = ["window"] }

# Embeds the Windows icon and the program's name (build.rs); nothing for other targets.
[build-dependencies]
winresource = { workspace = true }

# What Windows shows for the program (Explorer, the taskbar): read by build.rs.
[package.metadata.winresource]
ProductName = "Wordsmith Book"
FileDescription = "Wordsmith Book"
CompanyName = "The James C. J. Foundation"
LegalCopyright = "Copyright (c) 2026 the Wordsmith Book contributors. MIT OR Apache-2.0"

[[bin]]
name = "wordsmith-book"
path = "src/main.rs"
