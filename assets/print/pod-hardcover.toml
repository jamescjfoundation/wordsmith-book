# A print profile (docs/SPEC.md section 5): data only, changed without code.
id = "pod-hardcover"
name = "Print-on-demand hardcover"
checked = "2026-11-25"
source = "a print-on-demand service's public file guide for case-laminate hardcovers, as known on the date checked; to be rechecked by a person"
bleed = 0.125
min_type = 7.0
blank_run_inside = 2
blank_run_end = 10
spine_text_min_pages = 79
barcode = [2.0, 1.2]
min_pages = 75
even_pages = true

[paper]
white = 0.002252
cream = 0.0025
color = 0.002347

[max_pages]
white = 550
cream = 550
color = 480

# The case's hinge takes more of the inside, and the boards overhang the pages, so every margin
# is wider than the paperback's.
[minimum]
outside = 0.5
outside_bleed = 0.625
top = 0.5
bottom = 0.5

