# A Wordsmith Book design (docs/design-format.md).
schema = 1
id = "cozy"
name = "Cozy"
about = "Display small capitals for titles, a gentle ornament and a small-capital first line: a cozy mystery or a village romance."
genres = ["mystery", "romance", "contemporary"]
moods = ["light", "warm"]

[body]
font = "classic-serif"
size = 11.0
leading = 1.38
indent = 1.2

[chapter]
font = "display"
sink = 0.28
number_size = 12.0
number_case = "small-caps"
title_size = 20.0
ornament = "❧"
first_line = "small-caps"

[scene_break]
mark = "~ ❦ ~"

[heads]
style = "author-title"
folio = "foot"
size = 9.0
small_caps = true
