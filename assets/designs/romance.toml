# A Wordsmith Book design (docs/design-format.md).
schema = 1
id = "romance"
name = "Romance"
about = "Display titles with a flourish, a drop cap and a fleuron between scenes."
genres = ["romance", "historical", "womens-fiction"]
moods = ["warm", "elegant"]

[body]
font = "classic-serif"
size = 11.0
leading = 1.38
indent = 1.2

[chapter]
font = "display"
sink = 0.25
number_size = 12.0
number_case = "small-caps"
title_size = 26.0
ornament = "❦"
first_line = "drop-cap"
drop_lines = 3

[scene_break]
mark = "❦"
