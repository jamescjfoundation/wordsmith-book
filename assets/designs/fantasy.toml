# A Wordsmith Book design (docs/design-format.md).
schema = 1
id = "fantasy"
name = "Fantasy"
about = "Display capitals for titles, ornaments and a drop cap: an old tale's look."
genres = ["fantasy", "historical", "young-adult"]
moods = ["epic", "traditional"]

[body]
font = "classic-serif"
size = 11.5
leading = 1.35
indent = 1.2

[chapter]
font = "inscription"
sink = 0.25
number_size = 12.0
number_case = "small-caps"
title_size = 22.0
ornament = "☙ ❧"
first_line = "drop-cap"
drop_lines = 3

[scene_break]
mark = "☙ ❦ ❧"

[part]
number_size = 16.0
title_size = 30.0
