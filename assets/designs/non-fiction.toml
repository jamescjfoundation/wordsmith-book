# A Wordsmith Book design (docs/design-format.md).
schema = 1
id = "non-fiction"
name = "Non-fiction"
about = "A clear reading serif with sans-serif headings, chapters starting on any page."
genres = ["non-fiction", "memoir", "essays"]
moods = ["clear", "modern"]

[body]
font = "reading-serif"
size = 10.5
leading = 1.4
indent = 1.0

[chapter]
font = "sans"
start = "any"
sink = 0.15
number_size = 12.0
number_case = "as-written"
title_size = 22.0
align = "left"
first_line = "none"

[scene_break]
mark = "* * *"

[heads]
style = "title-chapter"
folio = "head"
size = 8.5
small_caps = false

[ebook]
first_line = "none"
