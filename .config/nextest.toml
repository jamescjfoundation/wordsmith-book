# Settings for cargo-nextest, which runs the tests of `cargo xtask ci` when it is installed
# (core decision 0003). `cargo test` does not read this file.
#
# cargo-nextest runs several test programs at a time. The programs below assert how long the
# interface takes to answer, so each takes every test slot and nothing runs beside it.
[[profile.default.overrides]]
filter = 'package(wordsmith-book-ui) & binary(live)'
threads-required = "num-test-threads"

[[profile.default.overrides]]
filter = 'package(wordsmith-book-ui) & binary(preview)'
threads-required = "num-test-threads"

# Run every test even after one has failed. The whole gate runs on macOS and Windows only in the
# release workflow, so a failure there should name every test that fails on that system in one
# run, not the first.
[profile.default]
fail-fast = false
